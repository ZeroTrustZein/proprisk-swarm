[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proprisk-swarm"
version = "0.1.0"
description = "PropRisk Swarm: Autonomous Multi-Agent Real Estate Risk Assessment and Diligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zein" }
]
dependencies = [
    "pydantic>=2.5.0",
    "typing_extensions>=4.8.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
proprisk = "proprisk_swarm.cli:cli"
proprisk-swarm = "proprisk_swarm.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["proprisk_swarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-v --cov=proprisk_swarm --cov-report=term-missing"
